<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-rotate">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #1f2933; }
      .sub   { font-size: 14px; fill: #52606d; }
      .panel { font-size: 17px; font-weight: 700; fill: #334155; letter-spacing: 1px; }
      .cap   { font-size: 12px; fill: #6b7280; }
      .lbl   { font-size: 13px; fill: #1f2933; }
      .small { font-size: 11px; fill: #6b7280; }
      .frozen { fill: #dbeafe; stroke: #3b5dc1; stroke-width: 2; }
      .train  { fill: #fde8e0; stroke: #e07a5f; stroke-width: 2; }
      .sum    { fill: #fff; stroke: #1f2933; stroke-width: 2; }
      .strut  { stroke: #2a9d8f; stroke-width: 4; stroke-linecap: round; }
      .joint  { fill: #196f6a; }
      .rods   { stroke: #2a9d8f; stroke-width: 3; stroke-linecap: round; }

      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.05); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.85; }
        50%      { opacity: 1; }
      }
      .open-sphere { transform-origin: 250px 250px; animation: breathe 5s ease-in-out infinite; }
      .live-joint  { animation: pulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="770" fill="#fafafa"/>

  <!-- Title -->
  <text x="500" y="42" text-anchor="middle" class="title">The Hoberman Lens — QLoRA as a folding toy</text>
  <text x="500" y="66" text-anchor="middle" class="sub">Pull a toy open, and you can watch exactly what a low-rank adapter does to a frozen weight matrix.</text>

  <!-- ============ LEFT PANEL: THE TOY ============ -->
  <text x="200" y="112" text-anchor="middle" class="panel">THE TOY</text>

  <!-- Closed sphere -->
  <circle cx="95" cy="250" r="38" fill="#e9f5f2" stroke="#2a9d8f" stroke-width="2"/>
  <line x1="95" y1="216" x2="95" y2="284" class="rods"/>
  <line x1="64" y1="232" x2="126" y2="268" class="rods"/>
  <line x1="64" y1="268" x2="126" y2="232" class="rods"/>
  <text x="95" y="318" text-anchor="middle" class="lbl">Closed — 9″ ball</text>
  <text x="95" y="336" text-anchor="middle" class="cap">the rigid frame you never touch</text>

  <!-- Expand arrow -->
  <line x1="138" y1="250" x2="205" y2="250" class="strut" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="171" y="240" text-anchor="middle" class="lbl">pull → expand</text>

  <!-- Open sphere (animated, faceted lattice) -->
  <g class="open-sphere">
    <circle cx="250" cy="250" r="100" fill="#e9f5f2" stroke="#2a9d8f" stroke-width="2"/>
    <circle cx="250" cy="250" r="40" fill="#f2faf8" stroke="#2a9d8f" stroke-width="1.5"/>
    <!-- 8 radial struts: inner -> outer -->
    <line x1="294.3" y1="268.4" x2="350" y2="250" class="strut"/>
    <line x1="268.4" y1="294.3" x2="320.7" y2="320.7" class="strut"/>
    <line x1="231.6" y1="294.3" x2="250" y2="350" class="strut"/>
    <line x1="205.7" y1="268.4" x2="179.3" y2="320.7" class="strut"/>
    <line x1="205.7" y1="231.6" x2="150" y2="250" class="strut"/>
    <line x1="231.6" y1="205.7" x2="179.3" y2="179.3" class="strut"/>
    <line x1="268.4" y1="205.7" x2="250" y2="150" class="strut"/>
    <line x1="294.3" y1="231.6" x2="320.7" y2="179.3" class="strut"/>
    <!-- 8 scissor cross-struts: outer -> previous inner -->
    <line x1="350" y1="250" x2="294.3" y2="231.6" class="strut"/>
    <line x1="320.7" y1="320.7" x2="294.3" y2="268.4" class="strut"/>
    <line x1="250" y1="350" x2="268.4" y2="294.3" class="strut"/>
    <line x1="179.3" y1="320.7" x2="231.6" y2="294.3" class="strut"/>
    <line x1="150" y1="250" x2="205.7" y2="268.4" class="strut"/>
    <line x1="179.3" y1="179.3" x2="205.7" y2="231.6" class="strut"/>
    <line x1="250" y1="150" x2="231.6" y2="205.7" class="strut"/>
    <line x1="320.7" y1="179.3" x2="268.4" y2="205.7" class="strut"/>
    <!-- joints at outer vertices -->
    <circle cx="350" cy="250" r="6" class="joint live-joint"/>
    <circle cx="320.7" cy="320.7" r="6" class="joint live-joint"/>
    <circle cx="250" cy="350" r="6" class="joint live-joint"/>
    <circle cx="179.3" cy="320.7" r="6" class="joint live-joint"/>
    <circle cx="150" cy="250" r="6" class="joint live-joint"/>
    <circle cx="179.3" cy="179.3" r="6" class="joint live-joint"/>
    <circle cx="250" cy="150" r="6" class="joint live-joint"/>
    <circle cx="320.7" cy="179.3" r="6" class="joint live-joint"/>
    <!-- joints at inner vertices -->
    <circle cx="294.3" cy="268.4" r="5" class="joint"/>
    <circle cx="268.4" cy="294.3" r="5" class="joint"/>
    <circle cx="231.6" cy="294.3" r="5" class="joint"/>
    <circle cx="205.7" cy="268.4" r="5" class="joint"/>
    <circle cx="205.7" cy="231.6" r="5" class="joint"/>
    <circle cx="231.6" cy="205.7" r="5" class="joint"/>
    <circle cx="268.4" cy="205.7" r="5" class="joint"/>
    <circle cx="294.3" cy="231.6" r="5" class="joint"/>
  </g>
  <text x="250" y="400" text-anchor="middle" class="lbl">Open — 30″ lattice</text>
  <text x="250" y="418" text-anchor="middle" class="cap">same frame, big change via the joints · it breathes</text>

  <!-- ============ RIGHT PANEL: THE MODEL ============ -->
  <text x="740" y="112" text-anchor="middle" class="panel">THE MODEL</text>

  <!-- x input -->
  <text x="588" y="452" class="lbl" font-size="15" font-style="italic">x</text>
  <path d="M592,446 L616,446" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="619" y1="446" x2="619" y2="300" stroke="#4a5568" stroke-width="1.2" opacity="0.4"/>
  <line x1="619" y1="446" x2="619" y2="438" stroke="#4a5568" stroke-width="1.2" opacity="0.4"/>

  <!-- Frozen W branch -->
  <rect x="622" y="252" width="150" height="78" rx="8" class="frozen"/>
  <text x="697" y="282" text-anchor="middle" class="lbl" font-weight="700" font-size="16">W</text>
  <text x="697" y="302" text-anchor="middle" class="small">base weights · 4-bit NF4</text>
  <text x="697" y="317" text-anchor="middle" class="small">frozen during training</text>
  <line x1="596" y1="300" x2="620" y2="300" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Trainable LoRA branch -->
  <rect x="622" y="418" width="96" height="56" rx="8" class="train"/>
  <text x="670" y="442" text-anchor="middle" class="lbl" font-weight="700">A</text>
  <text x="670" y="458" text-anchor="middle" class="small">(r × d)</text>

  <rect x="728" y="428" width="34" height="36" rx="6" fill="#fff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="745" y="444" text-anchor="middle" class="lbl" font-size="12" font-style="italic">r</text>
  <text x="745" y="484" text-anchor="middle" class="small">rank — the</text>
  <text x="745" y="498" text-anchor="middle" class="small">low-rank waist</text>

  <rect x="770" y="418" width="96" height="56" rx="8" class="train"/>
  <text x="818" y="442" text-anchor="middle" class="lbl" font-weight="700">B</text>
  <text x="818" y="458" text-anchor="middle" class="small">(d × r)</text>

  <line x1="718" y1="446" x2="726" y2="446" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="764" y1="446" x2="768" y2="446" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- scale + route into sum -->
  <text x="894" y="450" text-anchor="middle" class="lbl" font-size="12">× α/r</text>
  <line x1="868" y1="446" x2="890" y2="446" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M894,440 L894,362" fill="none" stroke="#4a5568" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Sum node -->
  <circle cx="904" cy="300" r="20" class="sum"/>
  <text x="904" y="306" text-anchor="middle" class="lbl" font-weight="700" font-size="18">+</text>
  <line x1="774" y1="300" x2="882" y2="300" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M904,262 L904,242" fill="none" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Output -->
  <line x1="924" y1="300" x2="958" y2="300" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="970" y="305" class="lbl" font-size="16" font-style="italic">y</text>

  <!-- Equation -->
  <text x="500" y="560" text-anchor="middle" class="lbl" font-size="15" font-weight="700">y = W·x + (α/r)·B·A·x</text>
  <text x="500" y="586" text-anchor="middle" class="lbl" font-size="14">The change is ΔW = (α/r)·B·A — a big matrix built from a tiny rank-r bottleneck.</text>

  <!-- ============ MAPPING LEGEND ============ -->
  <rect x="120" y="628" width="760" height="118" rx="10" fill="#fff" stroke="#cbd2d9" stroke-width="1.5"/>
  <text x="140" y="654" class="lbl" font-weight="700" font-size="13">The mapping</text>
  <line x1="470" y1="640" x2="470" y2="734" stroke="#cbd2d9" stroke-width="1.2"/>

  <text x="140" y="680" class="lbl">Rigid struts</text>
  <text x="140" y="698" class="small">frozen plastic frame</text>
  <text x="500" y="680" class="lbl">→  W</text>
  <text x="500" y="698" class="small">base weight matrix, 4-bit, frozen</text>

  <text x="140" y="720" class="lbl">Pivot joints</text>
  <text x="500" y="720" class="lbl">→  A, B</text>
  <text x="820" y="680" class="lbl">→  ΔW</text>
  <text x="820" y="698" class="small">the behavioral change</text>
  <text x="820" y="720" class="small">built cheaply via A·B</text>
</svg>
